<!DOCTYPE html>
<html>
    <head>
        <script src="jquery-3.7.1.js">
        </script>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            div {
                border-color:2px solid black;
                background-color: aqua;
                text-align: center;
                padding: 50px;
                font-size: 24px;
            }
        </style>
    </head>
    <body>
        <button><div>Click Me!</div></button>
    </body>
    <script>
        $(document).ready(function(){
            $('button').click(function(){
                $('div').text('Clicked');
            });
            $('button').dblclick(function(){
                $('div').css('background-color', 'yellow');
            });
            $('button').hover(function(){
                $('div').css('border-color', 'green');
            });
        });
    </script>
</html>
