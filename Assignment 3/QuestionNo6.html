<!DOCTYPE html>
<html>
	<head>
		<style>
			body {
				display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-color: #f0f0f0;
			}
			#myDiv {
				width: 100px;
				height: 100px;
				border: 2px solid black;
				margin-bottom: 20px;
				transition: background-color 0.3s, opacity 0.3s;

			}
			.highlight {
				background-color: yellow;
			}
			.dim {
				opacity: 0.5;
			}
			button {
				padding: 10px 20px;
				font-size: 16px;
				margin: 5px;
			}
		</style>
		<script src="jquery-3.7.1.js"></script>
	</head>
	<body>
		<div id="myDiv">Click the buttons to change my style!</div>
		<button class="highlightBtn">Add Highlight</button>
		<button class="dimBtn">Add Dim</button>
	</body>
	<script>
		$('document').ready(function(){
			$('.highlightBtn').click(function(){
				$('.myDiv').removeClass('dim').addClass('highlight');
			});
			$('.dimBtn').click(function(){
				$('#myDiv').removeClass('highlight').addClass('dim');
			});
		});
	</script>
</html>
