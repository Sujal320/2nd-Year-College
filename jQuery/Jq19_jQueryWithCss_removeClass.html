<!DOCTYPE html>
<html>
	<head>
		<script src="jquery-3.7.1.js"></script>
		
		<style>
			.green {
				color: green;
			}
		</style>
	</head>
<body>
	<h1 class='green'>first green Heading</h1>
	<h1 class='green'>second green Heading</h1>
	<p class='green'>This paragraph is green.</p>
	<p>This paragraph has no color.</p>
	<div>This is a piece of vital information.</div>
	<button>Delete the CSS class from the selected elements.</button>
</body>
<script>
	$(document).ready(function(){
			$('button').click(function(){
				$('h1, h2, p').removeClass('green');
			});
	});
</script>
</html>
