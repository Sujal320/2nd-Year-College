
<!DOCTYPE html>
<html>
	<head>
		<script src="jquery-3.7.1.js"></script>
	</head>
<body>
	<p><a href="https://www.google.com" id='go'></a></p>
	<button>Show href value</button>
</body>
<script>
	$(document).ready(function(){
			$('button').click(function(){
				alert($('#go').attr('href'));
			});
	});
</script>
</html>
