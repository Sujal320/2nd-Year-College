
<!DOCTYPE html>
<html>
	<head>
		<script src="jquery-3.7.1.js"></script>
	</head>
<body>
	<p id='par'>This is line is part of a a praragraph <b>and contains bold text.</b></p>
	<button id='b1'>Display Text</button>
	<button id='b2'>Display HTML</button>
</body>
<script>
	$(document).ready(function(){
			$('#b1').click(function(){
				alert('Text: ' + $('#par').text());
			});
			$('#b2').click(function(){
				alert('HTML: ' + $('#par').html());
			})
	});
</script>
</html>
