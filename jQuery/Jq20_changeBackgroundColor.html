<!DOCTYPE html>
<html>
	<head>
	<script src='jquery-3.7.1.js'>
	</script>
	</head>
<body>
	<h2>This is a heading</h2>
	<p id='p1' style='background-color: dodgerblue;'>This is first paragraph.</p>
	<p id='p2' style='background-color: orange;'>This is second paragraph.</p>
	<p id='p3' style='background-color: yellow;'>This is third paragraph.</p>
	<p>This paragraph is without any color.</p>
	<button>Adjust the background color of the paragraph.</button>
</body>
<script>
	$(document).ready(function(){
			$('button').click(function(){
				$('#p1').css('background-color', 'red');
				$('#p2').css('background-color', 'blue');
				$('#p3').css('background-color', 'green');
			});
	});
</script>
</html>
