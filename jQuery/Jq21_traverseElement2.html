<!DOCTYPE html>
<html>
	<head>
	<script src='jquery-3.7.1.js'>
	</script>
	<style>
		.outermost* {
			display: block;
			border: 2px solid lightgrey;
			color: green;
			padding: 6px;
			margin: 20px;
		}
	</style>
	</head>
<body>
	<div class='outermost'>
		<div style='width:400px;'>div (great-grandparent)
			<ol>ol (grandparent)
				<li>li (direct parent)
					<span>span</span>
				</li>
			</ol>
		</div>
		<div style='width:400px;'>div (grandparent)
			<p>p (direct parent)
				<span>span</span>
			</p>
		</div>
	</div>
</body>
<script>
	$(document).ready(function(){
			$('span').parentsUntill('div').css({'color': 'blue', 'border': '1px solid blue'});
	});
</script>
</html>
